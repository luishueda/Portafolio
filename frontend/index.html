<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/profile.webp" />
    <link rel="alternate icon" type="image/jpeg" href="/images/profile.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Luis Hueda desarrolla páginas web y sistemas personalizados para negocios que buscan soluciones digitales modernas y funcionales." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="Luis Hueda | Desarrollo web y sistemas personalizados" />
    <meta property="og:description" content="Páginas web y sistemas personalizados para impulsar negocios con soluciones digitales modernas y funcionales." />
    <title>Luis Hueda | Desarrollo web y sistemas personalizados</title>
  </head>
  <body>
    <script>
      // Netlify Identity sends invitation and password-recovery links to the site URL.
      // Forward their one-time hash token to Decap CMS, where the Identity widget can handle it.
      const identityHash = window.location.hash;
      if (/(invite_token|recovery_token|confirmation_token)/.test(identityHash)) {
        window.location.replace(`/admin/${identityHash}`);
      }
    </script>
    <div id="root"></div>
    <form name="cotizacion" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="service" />
      <input name="solution" />
      <input name="company" />
      <input name="whatsapp" />
      <input name="industry" />
      <textarea name="features"></textarea>
      <input name="budget" />
      <input name="timeframe" />
      <textarea name="content"></textarea>
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
